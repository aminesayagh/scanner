<!doctype html>
<html><head><meta charset="utf-8"><title>Infinite</title></head><body style="margin:0">
<div id="feed"></div>
<script>
  // Appends another block whenever the reader nears the bottom, forever.
  const feed = document.getElementById('feed');
  const add = () => { const d = document.createElement('div'); d.style.height = '600px'; d.textContent = 'item'; feed.append(d); };
  for (let i = 0; i < 3; i++) add();
  addEventListener('scroll', () => { if (scrollY + innerHeight > document.body.scrollHeight - 300) { add(); add(); } });
</script>
</body></html>
