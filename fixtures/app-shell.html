<!doctype html>
<html><head><meta charset="utf-8"><title>App shell</title>
<style>
  /* The window never scrolls; <body> is the scroller, as in many app-shell layouts. */
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { overflow: auto; }
  .panel { height: 500px; }
</style></head>
<body><div class="panel">Panel one</div><div class="panel">Panel two</div><div class="panel">Panel three</div></body></html>
